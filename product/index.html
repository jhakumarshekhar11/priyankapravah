<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Priyanka Pravah</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google One Tap -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <!-- =========================================
       Navigation Bar (Dynamically Handled)
       ========================================= -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="https://priyankapravah.live/" class="brand-logo">
                <span class="brand-primary">Priyanka</span><span class="brand-secondary">Pravah</span>
            </a>

            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label">
                <span></span>
            </label>

            <ul class="nav-links">
                <li><a href="/about/">About</a></li>
                <li><a href="/rcorner/">Reading Corner</a></li>
                <li><a href="/shop/">Shop</a></li>

                <li id="nav-admin" class="hidden"><a href="/admin/">Admin</a></li>

                <li id="nav-login"><a href="/login/" class="btn-login">Login</a></li>

                <li id="nav-logout" class="hidden">
                    <a href="#" class="btn-login"
                        style="background-color: transparent; border: 1px solid var(--royal-purple); color: var(--royal-purple) !important;">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- =========================================
       Main Product Details Section
       ========================================= -->
    <main class="product-details-section" id="product-details-container">
        <!-- SKELETON LOADER -->
        <div class="product-grid skeleton-active">
            <div class="product-image-gallery">
                <div class="skeleton-block" style="height: 450px; border-radius: 12px;"></div>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <div class="skeleton-block" style="height: 80px; flex: 1; border-radius: 8px;"></div>
                    <div class="skeleton-block" style="height: 80px; flex: 1; border-radius: 8px;"></div>
                    <div class="skeleton-block" style="height: 80px; flex: 1; border-radius: 8px;"></div>
                </div>
            </div>
            <div class="product-info">
                <div class="skeleton-block" style="height: 40px; width: 80%; margin-bottom: 1rem;"></div>
                <div class="skeleton-block" style="height: 50px; width: 40%; margin-bottom: 2rem;"></div>
                <div class="skeleton-block" style="height: 20px; width: 100%; margin-bottom: 0.5rem;"></div>
                <div class="skeleton-block" style="height: 20px; width: 100%; margin-bottom: 0.5rem;"></div>
                <div class="skeleton-block" style="height: 20px; width: 70%; margin-bottom: 2rem;"></div>
                <div class="skeleton-block" style="height: 50px; width: 100%; border-radius: 30px;"></div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script type="module" src="/firebaseconfig.js"></script>
    <script type="module" src="/globalauth.js"></script>
    <script type="module" src="/product/product.js"></script>
</body>
</html>
